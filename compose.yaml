services:
  mock:
    build:
      context: .
      target: mock
    environment:
      MOCK_SERVICE_ADDR: :8081
      MOCK_DATA_DIR: /data
    volumes:
      - mock-data:/data
    ports:
      - "127.0.0.1:${BUDDY_MOCK_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      target: api
    environment:
      API_ADDR: :8080
      MATERIALS_CATALOG_PATH: /app/materials.json
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:${BUDDY_WEB_PORT:-5173}}
      TICKET_SERVICE_URL: http://mock:8081
      ONBOARDING_SERVICE_URL: http://mock:8081
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5.6-luna}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
    depends_on:
      mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BUDDY_WEB_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  mock-data:
